# Android Studio settings can override these values.
# https://docs.gradle.org/current/userguide/build_environment.html
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Reuse task outputs from the build cache.
# See https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching=true
# Reuse the configured task graph between builds.
# See https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache=true
# Enable parallel builds only when modules can build independently.
# https://docs.gradle.org/current/userguide/multi_project_builds.html
# org.gradle.parallel=true
# Use AndroidX libraries.
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Follow Kotlin's official code style.
kotlin.code.style=official
# Keep each library's R class limited to its own resources.
android.nonTransitiveRClass=true

# Run Compose screenshot tests on the host.
android.experimental.enableScreenshotTest=true

# Baseline Profile 1.4.x uses the legacy Android DSL.
android.newDsl.optOut=:app,:benchmark
