name: 기능 제안
description: 새로운 기능이나 개선 아이디어를 제안해주세요.
labels:
  - enhancement
body:
  - type: textarea
    id: proposal
    attributes:
      label: 제안
      description: 제안하는 기능과 필요한 이유를 적어주세요.
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: 참고 자료
      description: 아이디어를 이해하는 데 도움이 되는 이미지나 링크가 있다면 첨부해주세요.
