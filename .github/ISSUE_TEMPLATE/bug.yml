name: 버그 제보
description: 발생한 문제를 알려주세요.
labels:
  - bug
body:
  - type: textarea
    id: problem
    attributes:
      label: 문제
      description: 발생한 현상과 재현 방법을 적어주세요.
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: 참고 자료
      description: 필요한 경우 스크린샷, 영상, 공개 가능한 로그나 링크를 첨부해주세요.
